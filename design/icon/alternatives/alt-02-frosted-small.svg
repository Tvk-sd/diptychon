<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <title>Diptychon icon — small-size artwork for the 16 and 32 px slots</title>
  <!-- Blur cannot survive 16 px: at that size the soft edge is wider than the
       shapes it separates. Same reading, drawn in whole pixels instead —
       two panels, the near one overlapping the far one, and the block that
       crosses. Three flat tones, no gradient, no blur. -->
  <rect x="0" y="0" width="16" height="16" rx="3.5" ry="3.5" fill="#101010"/>
  <rect x="7" y="3" width="7" height="6" rx="1" fill="#D8D8D8"/>
  <rect x="2" y="6" width="8" height="7" rx="1" fill="#8C8C8C"/>
  <rect x="9" y="8" width="3" height="3" fill="#FFFFFF"/>
</svg>
