<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Diptychon icon — black and white, alternative 04, glass over the stack</title>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3F3F3"/><stop offset="1" stop-color="#E4E4E4"/>
    </linearGradient>
    <linearGradient id="glass" x1="170" y1="400" x2="854" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.30"/>
    </linearGradient>
    <clipPath id="squircle"><rect width="1024" height="1024" rx="229" ry="229"/></clipPath>
    <clipPath id="glassClip"><rect x="170" y="400" width="684" height="404" rx="64"/></clipPath>
    <filter id="soften" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="cast" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#262626" flood-opacity="0.22"/>
    </filter>
    <g id="scene">
      <!-- the panel that holds the work -->
      <rect x="210" y="210" width="604" height="560" rx="72" fill="#191919"/>
      <!-- sheets standing in it -->
      <g transform="rotate(-7 400 330)">
        <rect x="262" y="150" width="292" height="330" rx="26" fill="#F8F8F8"/>
        <g fill="#CBCBCB"><rect x="298" y="200" width="200" height="16" rx="8"/><rect x="298" y="240" width="200" height="16" rx="8"/><rect x="298" y="280" width="150" height="16" rx="8"/></g>
      </g>
      <g transform="rotate(3 560 340)">
        <rect x="432" y="176" width="256" height="304" rx="24" fill="#FCFCFC"/>
        <g fill="#D1D1D1"><rect x="464" y="224" width="170" height="14" rx="7"/><rect x="464" y="260" width="170" height="14" rx="7"/><rect x="464" y="296" width="120" height="14" rx="7"/></g>
      </g>
      <g transform="rotate(12 690 350)">
        <rect x="566" y="196" width="230" height="286" rx="22" fill="#F5F5F5"/>
        <g fill="#D6D6D6"><rect x="596" y="242" width="150" height="13" rx="6"/><rect x="596" y="274" width="150" height="13" rx="6"/><rect x="596" y="306" width="105" height="13" rx="6"/></g>
      </g>
    </g>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#ground)"/>
    <g filter="url(#cast)"><use href="#scene"/></g>

    <!-- the glass front of the panel -->
    <g clip-path="url(#glassClip)">
      <use href="#scene" filter="url(#soften)"/>
      <rect x="170" y="400" width="684" height="404" fill="url(#glass)"/>
    </g>
    <rect x="170" y="400" width="684" height="404" rx="64" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="3"/>

  </g>
</svg>
